name: 构建并发布单文件

# 每次 push 到 main：装依赖 → 构建 → 按 package.json 的版本号打 tag 并发布单文件。
# 手机端固定下载地址（跨版本不变，永远拿到最新版）：
# https://github.com/GuanYunMao/xinggui-solar-system/releases/latest/download/xinggui.html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION"

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 确认单文件真的产出了
        run: |
          test -s "release/星轨.html"
          ls -lh release/

      - name: 准备发布用的文件名（避开 URL 里的中文）
        run: cp "release/星轨.html" release/xinggui.html

      - name: 发布 v${{ steps.version.outputs.value }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: 星轨 v${{ steps.version.outputs.value }}
          body: |
            版本 **v${{ steps.version.outputs.value }}**，由 GitHub Actions 从 `main` 构建。

            单文件 `xinggui.html`：双击就能玩，也能发到手机上用浏览器打开。
            更新内容见仓库里的 `CHANGELOG.md`。
          files: release/xinggui.html
          make_latest: true
          prerelease: false
