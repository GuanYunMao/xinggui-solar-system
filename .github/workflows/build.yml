name: 构建与发布

# 两条通道，按 package.json 的 version 自动分流：
#   正式版  1.0.2          → 建 release + 抢 latest（手机固定地址从这里取）
#   快照版  1.0.2-snap.3   → 只出 Actions artifact，绝不碰 release / latest
# 版本号是承诺不是计数器：小改动走 PATCH，随手改走快照，攒够了再并进正式版。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 读取版本与摘要
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTE=$(node -p "require('./package.json').releaseNote || ''")
          case "$VERSION" in
            *-snap.*) SNAP=true ;;
            *)        SNAP=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "note=$NOTE"        >> "$GITHUB_OUTPUT"
          echo "snap=$SNAP"        >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION · 通道 $([ "$SNAP" = true ] && echo 快照 || echo 正式)"

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 确认单文件真的产出了
        run: |
          test -s "release/巡星.html"
          ls -lh release/

      # ——— 静态闸：零依赖纯 node、秒级，红了就该拦（不许加 `|| true` 软处理）———
      # 这里刻意没有 `npm run check`。它 = `check-single-file.mjs && check-shape.mjs`，
      # 而 check-single-file.mjs 会 `chromium.launch` 一个**真实浏览器**。ubuntu-latest 上没有
      # 浏览器 → `browserType.launch: executable doesn't exist` → 未捕获异常 → exit 1，
      # 每次 push/tag 都**假红**：拦的理由变成「CI 没浏览器」，不是产物有问题。
      # 原话实测见 scripts/README.md「CI 与本地差异」。
      # ⚠ 已知下一步（不是口头遗愿，谁接谁把这段删掉）：给 runner 装一个 chromium 并设
      #   `XG_EDGE=/usr/bin/chromium`，届时这里加一行 `npm run check` 即可 —— 脚本侧已经支持
      #   `XG_EDGE`（check-single-file.mjs 与 verify.mjs 同一套读法），剩下的只是「装不装浏览器」
      #   这个决定。它真正的价值不在单文件检查，而在让 13 条行为验收（verify）进 CI。
      # 为什么放在「构建」之后：这两条闸现在只读 src/，其实先跑也能红（而且失败更早、更省时间）；
      # 放在 build 后面是因为将来真接上单文件检查后，它需要 `release/巡星.html` 已经存在。
      # 真正不能动的是**先后关系**：这两条必须先于「准备发布用文件名 / 上传 / 发布」，
      # 否则 tag 仍然是拿「构建成功」换来的，不是「验收通过」换来的。
      - name: 闸 1/3 · 形状判据 check:shape
        run: |
          # 显式声明 pipefail：`| tee` 会把 npm 的退出码换成 tee 的 0，等于隐式 `|| true`。
          set -o pipefail
          npm run check:shape 2>&1 | tee shape.log

      - name: 闸 1 的结论 → GITHUB_STEP_SUMMARY（VACUOUS 必须可见，但不判红）
        # always()：闸 1 红了也要把结论贴进 summary，否则失败时只有一份「红」没有上下文。
        if: always()
        run: |
          [ -f shape.log ] || exit 0
          {
            echo '### 形状判据 check:shape'
            echo ''
            echo '```'
            grep -E '^\[[0-9]+\] |^    命中=|^(状态|结论):' shape.log || true
            echo '```'
            echo ''
            vac=$(grep -c '| VACUOUS$' shape.log || true)
            if [ "$vac" -gt 0 ]; then
              echo "> ⚠ **$vac 条 VACUOUS 不是通过**：命中 0 = 判据在当前代码上已失去区分力。"
              echo '> 它们的牙齿由下一步 `check:shape --selftest` 证明（临时副本注入第二真相 → 断言必须变红）。'
            else
              echo '> 六条判据全部有实际命中，本产物上无 VACUOUS。'
            fi
            echo ''
            echo "> runner=\`$RUNNER_OS\` · node $(node -v) · 判据定义在 \`scripts/check-shape.mjs\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 闸 2/3 · 形状判据自检（证明每条护栏都会红）
        # 4 条 VACUOUS 在 CI 里等于「绿灯但没验」，这条闸补的是它们的牙齿：
        # 在临时副本里注入第二真相，六条判据必须各自变 FAIL，否则 exit 1。
        run: npm run check:shape:selftest

      - name: 闸 3/3 · README「线上正式版」== 线上的最新正式版
        # 离线那半条（README「开发中」== package.json）在 npm run check:shape 里，本地就能跑；
        # 这半条要"线上到底是哪版"，只能问线上。
        # 口径优先 `releases/latest`：**release 才是线上事实，tag 只是标记**——tag 可以在别的分支上、
        # 也可以有 tag 却不发 release（本仓库两种都真实存在）。拿不到 API 才回落到 tag，并明确声明降级。
        # 本地（非 CI）**明确打印跳过**，不静默，也不拿本地 tag 冒充线上。
        run: |
          set -o pipefail
          DOC=$(grep -m1 '^| 线上正式版' README.md | sed -E 's/.*\*\*([^*]+)\*\*.*/\1/')
          if [ -z "${GITHUB_ACTIONS:-}" ]; then
            echo "（非 CI 环境：跳过「线上正式版」这半条 —— 线上事实要问 GitHub release API，本地没有权威来源）"
            echo "  README 现在写的是：${DOC:-（读不到）}"
            echo "  本地 tag 只作参考（tag ≠ release）：$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n1)"
            exit 0
          fi
          LIVE=""
          if [ -n "${GITHUB_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
            LIVE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "$LIVE" ]; then
            git fetch --tags --force --quiet
            LIVE=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n1 | sed 's/^v//')
            echo "⚠ 拿不到 releases/latest，降级用 tag 口径：最高正式 tag = ${LIVE:-（挑不出来）}"
            echo "  tag ≠ release，这条降级结论要打折扣看"
          fi
          echo "线上最新正式版 = ${LIVE:-（未知）}；README「线上正式版」= ${DOC:-（读不到）}"
          if [ -z "$LIVE" ]; then
            echo "✗ 挑不出线上最新正式版 —— 判据失去对照物，先修来源，别让它静默变绿"
            exit 1
          fi
          if [ -z "$DOC" ]; then
            echo "✗ README 里读不到「| 线上正式版 |」那一行 —— 找不到就判红，不跳过"
            exit 1
          fi
          if [ "$LIVE" != "$DOC" ]; then
            echo "✗ README 的「线上正式版」是 $DOC，而线上最新正式版是 $LIVE —— 发版后忘了改文档"
            exit 1
          fi
          echo "✓ 一致：$LIVE"

      - name: 准备发布用文件名（避开 URL 里的中文）
        # 本地中间产物叫「巡星.html」，这里 cp 成 xinggui.html 再发。
        # 手机上的固定下载地址是 releases/latest/download/xinggui.html —— 这个名字不许动。
        run: cp "release/巡星.html" release/xinggui.html

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xinggui-${{ steps.meta.outputs.version }}
          path: release/xinggui.html
          retention-days: 14

      - name: 发布正式版
        if: steps.meta.outputs.snap == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 巡星 ${{ steps.meta.outputs.version }} · ${{ steps.meta.outputs.note }}
          body: |
            ${{ steps.meta.outputs.note }}

            完整记录见仓库 `CHANGELOG.md`。
          files: release/xinggui.html
          make_latest: true
          prerelease: false

      - name: 快照说明（不发布）
        if: steps.meta.outputs.snap == 'true'
        run: |
          echo "### 快照版 ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "不建 release、不动 latest。下载：本页 Artifacts → \`xinggui-${{ steps.meta.outputs.version }}\`。" >> "$GITHUB_STEP_SUMMARY"
